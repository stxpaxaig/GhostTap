name: Ghost Tap Android CI

on:
  push:
    branches:
      - "ghosttap/**"
  pull_request:
    branches:
      - main
      - "ghosttap/**"

permissions:
  contents: read

concurrency:
  group: ghosttap-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The checked-in wrapper is pre-existing; gradle-wrapper.properties
          # pins the downloaded Gradle distribution with its SHA-256 checksum.
          validate-wrappers: false

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ghost-tap-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
