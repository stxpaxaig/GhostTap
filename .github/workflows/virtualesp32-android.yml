name: VirtualESP32 Android build

on:
  workflow_dispatch:
  push:
    paths:
      - "virtual-esp32/**"
      - ".github/workflows/virtualesp32-android.yml"
  pull_request:
    paths:
      - "virtual-esp32/**"
      - ".github/workflows/virtualesp32-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build VirtualESP32 debug APK
        working-directory: virtual-esp32
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload VirtualESP32 APK
        uses: actions/upload-artifact@v4
        with:
          name: virtualesp32-debug
          path: virtual-esp32/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
